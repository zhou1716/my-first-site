<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>测姓名</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    /* 大标题 */
    .title {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 4px;
      text-align: center;
      color: #000;
      margin-bottom: 40px;
    }

    /* 表单区 */
    .form-area {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .question {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .question label {
      font-size: 17px;
      font-weight: 600;
      color: #000;
      letter-spacing: 0.5px;
    }

    .question input {
      width: 100%;
      font-size: 17px;
      padding: 12px 14px;
      border: none;
      border-bottom: 2px solid #d1d1d6;
      outline: none;
      background: transparent;
      color: #000;
      font-family: inherit;
      transition: border-color 0.25s ease;
    }

    .question input:focus {
      border-bottom-color: #007aff;
    }

    .question input::placeholder {
      color: #c5c5ca;
    }

    /* 思考动画区 */
    .thinking {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .thinking.show {
      display: flex;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e5e5ea;
      border-top-color: #8e8e93;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .thinking-text {
      font-size: 14px;
      color: #8e8e93;
      letter-spacing: 1px;
    }

    /* 结果区 */
    .result {
      display: none;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    .result.show {
      display: flex;
    }

    .result-name {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #000;
      text-align: center;
      opacity: 0;
      /* 白色描边 + 灰色阴影，名字从烟花里浮出来 */
      text-shadow:
        -2px -2px 0 #fff,
        2px -2px 0 #fff,
        -2px 2px 0 #fff,
        2px 2px 0 #fff,
        0 6px 18px rgba(0,0,0,0.25);
    }

    .result-name.appear {
      animation: nameAppear 0.9s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
    }

    @keyframes nameAppear {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      60% {
        opacity: 1;
        transform: scale(1.15);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 烟花层 */
    .fireworks {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .firework-block {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: explode 3.5s ease-out forwards;
    }

    @keyframes explode {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(540deg);
      }
    }

    /* 介绍页 */
    .credits {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .credits.show {
      display: flex;
    }

    .credits.fade-in {
      opacity: 1;
    }

    .credits-line {
      font-size: 17px;
      color: #000;
      letter-spacing: 1px;
      line-height: 1.7;
    }

    .credits-line.thanks {
      font-size: 15px;
      color: #8e8e93;
      margin-top: 4px;
    }

    /* 重新测试 */
    .restart-btn {
      margin-top: 60px;
      font-size: 13px;
      color: #c5c5ca;
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
      font-family: inherit;
      transition: color 0.25s ease;
    }

    .restart-btn:hover {
      color: #8e8e93;
    }
  </style>
</head>
<body>

  <!-- 第一环节：表单 -->
  <div id="formStage">
    <h1 class="title">测姓名</h1>
    <div class="form-area">
      <div class="question">
        <label for="nameInput">您的姓名是？</label>
        <input type="text" id="nameInput" placeholder="请输入姓名" autocomplete="off" />
      </div>
      <div class="question">
        <label for="ageInput">您的年龄是？</label>
        <input type="text" id="ageInput" placeholder="请输入年龄" autocomplete="off" />
      </div>
    </div>
  </div>

  <!-- 第二环节：思考 -->
  <div class="thinking" id="thinkingStage">
    <div class="spinner"></div>
    <div class="thinking-text">正在思考您的姓名</div>
  </div>

  <!-- 第三环节：结果 -->
  <div class="result" id="resultStage">
    <div class="result-name" id="resultName">XXX！</div>
  </div>

  <!-- 烟花层 -->
  <div class="fireworks" id="fireworks"></div>

  <!-- 第四环节：制作人介绍 -->
  <div class="credits" id="creditsStage">
    <div class="credits-line">制作人：zxy（@17）</div>
    <div class="credits-line">特别鸣谢：DeepSeek</div>
    <div class="credits-line">中途测试：@真心话</div>
    <div class="credits-line thanks">感谢支持^_^</div>
    <button class="restart-btn" onclick="restart()">重新测试</button>
  </div>

<script>
  const formStage = document.getElementById('formStage');
  const thinkingStage = document.getElementById('thinkingStage');
  const resultStage = document.getElementById('resultStage');
  const resultName = document.getElementById('resultName');
  const creditsStage = document.getElementById('creditsStage');
  const nameInput = document.getElementById('nameInput');
  const ageInput = document.getElementById('ageInput');
  const fireworksLayer = document.getElementById('fireworks');

  const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3',
                  '#54a0ff', '#5f27cd', '#01a3a4', '#f368e0',
                  '#ff9f43', '#10ac84', '#ee5253', '#0abde3'];

  let triggered = false;
  let delayTimer = null;

  // 两个框都填完，停止输入 2 秒后触发
  function scheduleCheck() {
    if (triggered) return;
    if (delayTimer) clearTimeout(delayTimer);

    const name = nameInput.value.trim();
    const age = ageInput.value.trim();

    // 有一个空着就不排计时
    if (!name || !age) return;

    delayTimer = setTimeout(() => {
      const n = nameInput.value.trim();
      const a = ageInput.value.trim();
      if (n && a && !triggered) {
        triggered = true;
        startThinking(n);
      }
    }, 2000); // 停止输入 2 秒
  }

  nameInput.addEventListener('input', scheduleCheck);
  ageInput.addEventListener('input', scheduleCheck);

  function startThinking(name) {
    formStage.style.display = 'none';
    thinkingStage.classList.add('show');

    // 思考 3 秒
    setTimeout(() => {
      thinkingStage.classList.remove('show');
      showResult(name);
    }, 3000);
  }

  function showResult(name) {
    resultName.textContent = name + '！';
    resultStage.classList.add('show');
    resultName.classList.add('appear');

    // 名字和烟花同时出现
    launchFireworks();

    // 烟花 3.5 秒结束后，进入介绍页
    setTimeout(() => {
      resultStage.classList.remove('show');
      showCredits();
    }, 4000);
  }

  function showCredits() {
    creditsStage.classList.add('show');
    // 强制重绘后淡入
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        creditsStage.classList.add('fade-in');
      });
    });
  }

  function launchFireworks() {
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    // 共 3.5 秒，每 200ms 炸一波
    let count = 0;
    const interval = setInterval(() => {
      explodeOnce(centerX, centerY);
      count++;
      if (count >= 17) clearInterval(interval); // 17 × 200ms ≈ 3.4s
    }, 200);
  }

  function explodeOnce(cx, cy) {
    const count = 16 + Math.floor(Math.random() * 10);

    for (let i = 0; i < count; i++) {
      const block = document.createElement('div');
      block.className = 'firework-block';

      const color = colors[Math.floor(Math.random() * colors.length)];
      block.style.background = color;

      block.style.left = cx + 'px';
      block.style.top = cy + 'px';

      const size = 8 + Math.random() * 8;
      block.style.width = size + 'px';
      block.style.height = size + 'px';

      const shape = Math.random();
      if (shape > 0.7) {
        block.style.borderRadius = '50%';
      } else if (shape > 0.5) {
        block.style.clipPath = 'polygon(50% 0%, 0% 100%, 100% 100%)';
      }

      const angle = Math.random() * Math.PI * 2;
      const distance = 120 + Math.random() * 200;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;

      block.style.setProperty('--tx', tx + 'px');
      block.style.setProperty('--ty', ty + 'px');

      fireworksLayer.appendChild(block);

      setTimeout(() => block.remove(), 3600);
    }
  }

  // 重新测试
  function restart() {
    // 重置状态
    triggered = false;
    if (delayTimer) clearTimeout(delayTimer);

    // 清空输入
    nameInput.value = '';
    ageInput.value = '';

    // 隐藏所有阶段
    resultStage.classList.remove('show');
    resultName.classList.remove('appear');
    creditsStage.classList.remove('show');
    creditsStage.classList.remove('fade-in');
    thinkingStage.classList.remove('show');

    // 清空烟花
    fireworksLayer.innerHTML = '';

    // 显示表单
    formStage.style.display = 'block';
  }

  window.restart = restart;
</script>

</body>
</html>
